name: iOS 27 build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.'
      - name: Select an iOS 27 simulator
        id: simulator
        env:
          DEVICE_FAMILY: ${{ matrix.device }}
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as source:
              devices = json.load(source)['devices']
          matches = [device for runtime, rows in devices.items() if runtime.endswith('iOS-27-0') for device in rows if device['name'].startswith(os.environ['DEVICE_FAMILY']) and device['isAvailable']]
          if not matches:
              raise SystemExit('No available iOS 27 simulator for ' + os.environ['DEVICE_FAMILY'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('uuid=' + matches[0]['udid'] + '\n')
          PY
      - name: Build and test
        run: ./scripts/test-ios.sh '${{ steps.simulator.outputs.uuid }}' "$RUNNER_TEMP/Tests.xcresult"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.device }}
          path: ${{ runner.temp }}/Tests.xcresult
          retention-days: 14
