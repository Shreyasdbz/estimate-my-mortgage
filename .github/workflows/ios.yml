name: iOS 27 build and tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "PrivacyPolicy.md", "LICENSE"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  groups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify keyboard fixture helper
        run: python3 -B -m unittest discover -s scripts -p 'test_configure_simulator_keyboard.py'
      - name: Validate and read test groups
        id: groups
        run: |
          groups=$(python3 scripts/test-groups.py --list-groups)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
  test:
    needs: groups
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.'
      - name: Select an iOS 27 simulator
        id: simulator
        env:
          DEVICE_FAMILY: ${{ matrix.device }}
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as source:
              devices = json.load(source)['devices']
          matches = [device for runtime, rows in devices.items() if runtime.endswith('iOS-27-0') for device in rows if device['name'].startswith(os.environ['DEVICE_FAMILY']) and device['isAvailable']]
          if not matches:
              raise SystemExit('No available iOS 27 simulator for ' + os.environ['DEVICE_FAMILY'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('uuid=' + matches[0]['udid'] + '\n')
          PY
      - name: Configure software keyboard fixture
        env:
          SELECTED_SIMULATOR: ${{ steps.simulator.outputs.uuid }}
        run: python3 -B scripts/configure-simulator-keyboard.py "$SELECTED_SIMULATOR"
      - name: Start active Xcode DeviceHub frontend
        run: |
          set -euo pipefail
          if ! device_hub_app=$(cd "$DEVELOPER_DIR/../Applications/DeviceHub.app" && pwd -P); then
            echo '::error::The active Xcode must contain DeviceHub at Contents/Applications/DeviceHub.app.'
            exit 1
          fi
          if ! bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$device_hub_app/Contents/Info.plist"); then
            echo '::error::Cannot read the active Xcode DeviceHub bundle identity.'
            exit 1
          fi
          if [[ "$bundle_id" != com.apple.dt.Devices ]]; then
            echo '::error::The active Xcode frontend must have bundle identifier com.apple.dt.Devices.'
            exit 1
          fi
          # Match the maintainer's normal lifecycle: preferences, frontend, then selected-device boot.
          # https://github.com/appium/appium-ios/blob/main/packages/simulator/lib/extensions/ui-client.ts
          printf 'Starting active Xcode frontend: %s (%s)\n' "$device_hub_app" "$bundle_id"
          if ! open -Fn "$device_hub_app"; then
            echo '::error::Cannot schedule the active Xcode DeviceHub frontend launch.'
            exit 1
          fi
          frontend_pattern=$(python3 -c 'import re, sys; print("^" + re.escape(sys.argv[1]) + "/Contents/MacOS/")' "$device_hub_app")
          deadline=$((SECONDS + 30))
          while true; do
            if frontend_pids=$(pgrep -f "$frontend_pattern"); then
              break
            else
              process_status=$?
            fi
            if [[ "$process_status" -ne 1 ]]; then
              echo '::error::Cannot discover the active Xcode DeviceHub frontend process.'
              exit 1
            fi
            if [[ "$SECONDS" -ge "$deadline" ]]; then
              echo '::error::The active Xcode DeviceHub frontend was not discoverable within 30 seconds.'
              exit 1
            fi
            sleep 1
          done
          printf 'Active Xcode DeviceHub frontend launched (PIDs %s); selected-device boot follows.\n' "$frontend_pids"
          echo 'PID discovery proves frontend launch only; it does not establish selected-window presentation, keyboard behavior, or failure cause.'
      - name: Wait for simulator readiness
        run: xcrun simctl bootstatus '${{ steps.simulator.outputs.uuid }}' -b
      - name: Record frontend before testing
        env:
          SELECTED_SIMULATOR: ${{ steps.simulator.outputs.uuid }}
        run: |
          set -euo pipefail
          printf 'Selected simulator after boot/before test: %s\n' "$SELECTED_SIMULATOR"
          if frontend_pids=$(pgrep -x DeviceHub); then
            printf 'DeviceHub frontend before test: running (PIDs %s)\n' "$frontend_pids"
          else
            process_status=$?
            if [[ "$process_status" -ne 1 ]]; then
              echo '::error::Cannot determine DeviceHub frontend state before testing.'
              exit 1
            fi
            echo 'DeviceHub frontend before test: not running'
          fi
          echo 'Observed process state does not establish selected-window presentation, effective keyboard mode, or failure cause.'
      - name: Build and test
        run: ./scripts/test-ios.sh '${{ steps.simulator.outputs.uuid }}' "$RUNNER_TEMP/Tests.xcresult" '${{ matrix.group }}'
      - name: Record frontend after test attempt
        if: always()
        env:
          SELECTED_SIMULATOR: ${{ steps.simulator.outputs.uuid }}
        run: |
          set -euo pipefail
          printf 'Selected simulator after test attempt: %s\n' "$SELECTED_SIMULATOR"
          if frontend_pids=$(pgrep -x DeviceHub); then
            printf 'DeviceHub frontend after test attempt: running (PIDs %s)\n' "$frontend_pids"
          else
            process_status=$?
            if [[ "$process_status" -ne 1 ]]; then
              echo '::error::Cannot determine DeviceHub frontend state after the test attempt.'
              exit 1
            fi
            echo 'DeviceHub frontend after test attempt: not running'
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.device }}-${{ matrix.group }}
          path: ${{ runner.temp }}/Tests.xcresult
          retention-days: 14
