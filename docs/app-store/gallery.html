<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Version 2.0 screenshots</title>
<style>
body { margin: 24px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #20202b; background: #fff; }
main { max-width: 1440px; margin: auto; }
h1 { font-size: 28px; margin: 0 0 24px; }
h2 { font-size: 20px; margin: 24px 0 12px; }
.screens { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 20px; }
a { display: block; border-radius: 12px; overflow: hidden; }
a:focus-visible { outline: 3px solid #5d46cc; outline-offset: 4px; }
img { display: block; width: 100%; height: auto; }
@media (max-width: 650px) { .screens { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; } }
</style>
<main>
<h1>Version 2.0 screenshots</h1>
<h2>iPhone</h2>
<div class="screens">
<a href="screenshots/iphone-01-costs.png"><img src="screenshots/iphone-01-costs.png" alt="See your monthly cost"></a>
<a href="screenshots/iphone-02-compare.png"><img src="screenshots/iphone-02-compare.png" alt="Compare your loan options"></a>
<a href="screenshots/iphone-03-balance.png"><img src="screenshots/iphone-03-balance.png" alt="Follow your loan balance"></a>
<a href="screenshots/iphone-04-preview.png"><img src="screenshots/iphone-04-preview.png" alt="Adjust costs. See the change"></a>
</div>
<h2>iPad</h2>
<div class="screens">
<a href="screenshots/ipad-01-costs.png"><img src="screenshots/ipad-01-costs.png" alt="See your monthly cost on iPad"></a>
<a href="screenshots/ipad-02-compare.png"><img src="screenshots/ipad-02-compare.png" alt="Compare your loan options on iPad"></a>
<a href="screenshots/ipad-03-balance.png"><img src="screenshots/ipad-03-balance.png" alt="Follow your loan balance on iPad"></a>
<a href="screenshots/ipad-04-preview.png"><img src="screenshots/ipad-04-preview.png" alt="Adjust costs and see the change on iPad"></a>
</div>
</main>
</html>
